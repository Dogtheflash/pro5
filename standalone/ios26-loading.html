<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>iOS 26 Loading Screen — Tú Xinh Trai</title>
    <meta name="description" content="iOS 26 boot/loading screen with glassmorphism, pink Vapor aurora, particle field, startup chime and audio visualizer." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./ios26-loading.css" />
  </head>
  <body>
    <!-- ===== Root: fixed pink Vapor wallpaper ===== -->
    <div id="app" class="mood-vapor">
      <!-- Ambient depth background -->
      <div id="bg-layer" class="bg-layer">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
        <div class="aurora aurora-4"></div>
        <div class="mesh-grid"></div>
        <div class="vignette"></div>
      </div>

      <!-- Particle field canvas -->
      <canvas id="particles" class="particles-canvas"></canvas>

      <!-- Frosted glass depth layers -->
      <div class="screen-glass"></div>
      <div class="top-frost"></div>
      <div class="noise"></div>
      <div class="scanline"></div>

      <!-- Shockwave rings (injected by JS on boot completion) -->
      <div id="shockwaves" class="shockwave-layer"></div>

      <!-- White flash (injected by JS) -->
      <div id="flash-layer" class="flash-layer"></div>

      <!-- ===== BOOT stage ===== -->
      <div id="stage-boot" class="stage-content stage-boot">
        <button id="logo-btn" class="logo-enter" aria-label="Apple logo">
          <div class="halo"></div>
          <span class="pulse-ring"></span>
          <span class="pulse-ring" style="animation-delay:1.3s"></span>
          <span class="pulse-ring" style="animation-delay:2.6s"></span>
          <div class="logo-breathe"></div>
          <svg viewBox="0 0 384 512" class="logo-float" id="logo-svg">
            <defs>
              <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="45%" stop-color="#e8e8ee" />
                <stop offset="70%" stop-color="#b9bac4" />
                <stop offset="100%" stop-color="#d9dae2" />
              </linearGradient>
              <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="white" stop-opacity="0" />
                <stop offset="45%" stop-color="white" stop-opacity="0" />
                <stop offset="50%" stop-color="white" stop-opacity="0.95" />
                <stop offset="55%" stop-color="white" stop-opacity="0" />
                <stop offset="100%" stop-color="white" stop-opacity="0" />
                <animateTransform attributeName="gradientTransform" type="translate" from="-384 0" to="384 0" dur="2.6s" repeatCount="indefinite" />
              </linearGradient>
              <clipPath id="appleClip">
                <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
              </clipPath>
            </defs>
            <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="6" class="logo-trace" />
            <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" fill="url(#chrome)" class="logo-fill" />
            <rect width="384" height="512" clip-path="url(#appleClip)" fill="url(#shine)" />
          </svg>
        </button>

        <!-- Signature name under the logo -->
        <div class="name-mount" id="name-mount"></div>

        <!-- Progress bar -->
        <div class="progress-enter progress-wrap">
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill" style="width:0%">
              <div class="progress-gradient"></div>
              <div class="progress-cap"></div>
            </div>
            <div class="bar-sheen"></div>
          </div>
          <div class="boot-line-row">
            <p id="boot-line" class="line-swap">Preparing iOS 26…</p>
          </div>
          <p id="boot-percent" class="boot-percent">0%</p>
        </div>
      </div>

      <!-- ===== HELLO stage ===== -->
      <div id="stage-hello" class="stage-content stage-hello" style="display:none">
        <svg viewBox="0 0 520 200" class="hello-fade hello-svg" aria-label="hello">
          <defs>
            <linearGradient id="helloGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#7dd3fc">
                <animate attributeName="stop-color" values="#7dd3fc;#f9a8d4;#fcd34d;#7dd3fc" dur="6s" repeatCount="indefinite" />
              </stop>
              <stop offset="50%" stop-color="#c4b5fd">
                <animate attributeName="stop-color" values="#c4b5fd;#fcd34d;#7dd3fc;#c4b5fd" dur="6s" repeatCount="indefinite" />
              </stop>
              <stop offset="100%" stop-color="#fcd34d">
                <animate attributeName="stop-color" values="#fcd34d;#7dd3fc;#c4b5fd;#fcd34d" dur="6s" repeatCount="indefinite" />
              </stop>
            </linearGradient>
            <filter id="helloGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <text x="50%" y="62%" text-anchor="middle" dominant-baseline="middle" class="hello-text" fill="none" stroke="url(#helloGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#helloGlow)">hello</text>
        </svg>
        <p class="hello-sub">H E L L O</p>
      </div>

      <!-- ===== READY stage ===== -->
      <div id="stage-ready" class="stage-content stage-ready" style="display:none">
        <div class="done-rise ready-title-group">
          <p class="ready-title">iOS 26</p>
          <p class="ready-subtitle">Tap the Dynamic Island to explore</p>
        </div>
        <button id="replay-btn" class="glass-btn replay-btn">
          <span class="replay-label">
            <svg class="icon-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Replay boot animation
          </span>
          <span class="btn-sheen"></span>
        </button>
        <button id="chime-btn" class="done-rise chime-btn">
          <svg class="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span id="chime-btn-text">Tap to hear the startup chime</span>
        </button>
      </div>

      <!-- ===== Fixed chrome overlays ===== -->

      <!-- Status bar -->
      <div class="status-bar">
        <div class="status-in status-clock">
          <span id="clock-time" class="clock-time">--:--</span>
          <span id="clock-seconds" class="clock-seconds">--</span>
        </div>
        <div class="status-in status-indicators">
          <span class="signal-bars">
            <span class="signal-bar" style="height:5px"></span>
            <span class="signal-bar" style="height:8px"></span>
            <span class="signal-bar" style="height:11px"></span>
            <span class="signal-bar signal-bar-dim" style="height:14px"></span>
          </span>
          <svg viewBox="0 0 18 14" class="wifi-icon">
            <path d="M9 12.4 6.7 9.9a3.3 3.3 0 0 1 4.6 0Z" fill="currentColor" />
            <path d="M4.4 7.4a6.6 6.6 0 0 1 9.2 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <path d="M1.9 4.7a10.2 10.2 0 0 1 14.2 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <span class="battery-shell">
            <span class="battery-fill"></span>
            <span class="battery-nub"></span>
          </span>
        </div>
      </div>

      <!-- Chime visualizer canvas -->
      <canvas id="visualizer" class="visualizer-canvas"></canvas>

      <!-- Ripple layer -->
      <div id="ripple-layer" class="ripple-layer"></div>

      <!-- Dynamic Island (static) -->
      <div class="island-mount">
        <span class="island-bloom"></span>
        <div class="island island-pill">
          <span class="island-specular"></span>
          <span class="island-lens"></span>
        </div>
      </div>

      <!-- Speed slider -->
      <div class="speed-slider-mount">
        <div id="speed-slider" class="picker-in speed-bar" style="display:none">
          <svg class="icon-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
          <input type="range" id="speed-range" min="0.5" max="2" step="0.05" value="1" class="speed-range" aria-label="Particle speed" />
          <span id="speed-readout" class="speed-readout">1.00x</span>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
